<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hledání v kanálu</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#666; --card:#f6f6f7; --accent:#c00; --mark:#fff3a8; --border:#e3e3e6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121214; --fg:#eee; --muted:#9a9aa3; --card:#1c1c20; --accent:#ff4d4d; --mark:#5a4b00; --border:#2b2b31; }
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif }
  header { padding:24px 16px 8px; max-width:960px; margin:0 auto }
  h1 { font-size:22px; margin:0 0 4px } h1 a { color:inherit; text-decoration:none }
  .sub { color:var(--muted); font-size:14px }
  form { display:flex; gap:8px; max-width:960px; margin:12px auto; padding:0 16px }
  input[type=search] { flex:1; font-size:18px; padding:10px 14px; border:1px solid var(--border); border-radius:10px; background:var(--card); color:var(--fg) }
  button { font-size:16px; padding:10px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer }
  select { font-size:14px; border:1px solid var(--border); border-radius:10px; background:var(--card); color:var(--fg); padding:0 8px }
  main { max-width:960px; margin:0 auto; padding:0 16px 48px }
  .status { color:var(--muted); font-size:14px; margin:8px 0 }
  .hit { display:grid; grid-template-columns:200px 1fr; gap:14px; padding:14px; margin:10px 0; background:var(--card); border-radius:12px; border:1px solid var(--border) }
  .hit img { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:8px; background:#000 }
  .hit h2 { font-size:17px; margin:0 0 4px } .hit h2 a { color:inherit; text-decoration:none } .hit h2 a:hover { text-decoration:underline }
  .meta { color:var(--muted); font-size:13px; margin-bottom:6px }
  .m { margin:4px 0; font-size:15px } .m a { color:var(--accent); text-decoration:none; font-variant-numeric:tabular-nums; margin-right:6px }
  mark { background:var(--mark); color:inherit; border-radius:3px; padding:0 2px }
  .more { font-size:13px; color:var(--muted); cursor:pointer; margin-top:4px }
  @media (max-width:600px) { .hit { grid-template-columns:1fr } }
</style>
</head>
<body>
<header>
  <h1><a id="chname" href="#">Hledání v kanálu</a></h1>
  <div class="sub" id="chstats">Načítám…</div>
</header>
<form id="f">
  <input type="search" id="q" placeholder="Hledej v transkriptech… (fráze dej do uvozovek)" autofocus>
  <select id="mode" title="Režim hledání">
    <option value="hybrid">hybridní</option>
    <option value="fts">fulltext</option>
    <option value="vector">sémantické</option>
  </select>
  <button type="submit">Hledat</button>
</form>
<main>
  <div class="status" id="status"></div>
  <div id="results"></div>
</main>
<script>
const API = location.origin;
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// highlighted obsahuje jen <mark> značky z backendu – escapujeme vše ostatní
const hl = s => esc(s).replace(/&lt;mark&gt;/g,'<mark>').replace(/&lt;\/mark&gt;/g,'</mark>');
const fmtDate = s => s ? new Date(s).toLocaleDateString('cs-CZ') : '';
const fmtDur = s => { if(!s) return ''; const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h?`${h} h ${m} min`:`${m} min`; };

async function loadChannel(){
  try{
    const r = await fetch(API+'/api/channel'); if(!r.ok) throw 0;
    const c = await r.json();
    $('#chname').textContent = c.name; $('#chname').href = c.url; document.title = c.name + ' – hledání';
    const s = c.stats, done = (s.videos_by_status||{}).done||0;
    $('#chstats').textContent = `${done} z ${s.videos} videí zaindexováno · ${s.total_hours} h přepisů · ${s.vector_search?'hybridní':'fulltextové'} hledání`;
  }catch{ $('#chstats').textContent = 'Kanál zatím není inicializován (ytindex init / ingest).'; }
}

async function doSearch(q){
  if(!q.trim()) return;
  history.replaceState(null,'','?q='+encodeURIComponent(q)+'&mode='+$('#mode').value);
  $('#status').textContent = 'Hledám…'; $('#results').innerHTML='';
  const t0 = performance.now();
  const r = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}&limit=30&mode=${$('#mode').value}`);
  if(!r.ok){ $('#status').textContent = 'Chyba: '+r.status; return; }
  const d = await r.json();
  $('#status').textContent = `${d.total} videí · ${(performance.now()-t0).toFixed(0)} ms · režim ${d.mode}`;
  $('#results').innerHTML = d.results.map(h => `
    <article class="hit">
      <a href="${esc(h.match.url)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(h.thumbnail)}" alt=""></a>
      <div>
        <h2><a href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title)}</a></h2>
        <div class="meta">${[fmtDate(h.published_at), fmtDur(h.duration_s)].filter(Boolean).join(' · ')}${h.published_at||h.duration_s?' · ':''}${h.match_count} ${h.match_count===1?'shoda':h.match_count<5?'shody':'shod'}</div>
        ${h.matches.map((m,i)=>`<div class="m" ${i?'hidden':''}><a href="${esc(m.url)}" target="_blank" rel="noopener">▶ ${m.timestamp}</a>${hl(m.highlighted)}</div>`).join('')}
        ${h.matches.length>1?`<div class="more" onclick="this.parentNode.querySelectorAll('.m').forEach(e=>e.hidden=false);this.remove()">+ ${h.matches.length-1} další</div>`:''}
      </div>
    </article>`).join('') || '<p class="status">Nic nenalezeno.</p>';
}

$('#f').addEventListener('submit', e => { e.preventDefault(); doSearch($('#q').value); });
loadChannel();
const p = new URLSearchParams(location.search);
if(p.get('mode')) $('#mode').value = p.get('mode');
if(p.get('q')){ $('#q').value = p.get('q'); doSearch(p.get('q')); }
</script>
</body>
</html>
