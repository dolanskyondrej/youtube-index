<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hledání v kanálu</title>
<meta name="theme-color" content="#111111">
<style>
  /* Barvy Svobodného přístavu: žlutá + černá, světlé/tmavé téma. */
  :root {
    --yellow: #f7c600; --yellow-ink: #111111; --yellow-soft: #fff1b3;
    --bg: #ffffff; --fg: #111111; --muted: #5f5f5f; --surface: #f7f7f5; --line: #e2e2dd;
    --accent: #111111; --accent-ink: #ffffff; --link: #8a6d00; --mark: #ffe066; --mark-ink: #111111;
    --tab-bg: #efefeb; --tab-active: #111111; --tab-active-ink: #f7c600;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --yellow-soft: #3d3300;
      --bg: #0f0f10; --fg: #f2f2ef; --muted: #a3a39c; --surface: #1a1a1c; --line: #2c2c2f;
      --accent: #f7c600; --accent-ink: #111111; --link: #f7c600; --mark: #5c4a00; --mark-ink: #fff3b0;
      --tab-bg: #1a1a1c; --tab-active: #f7c600; --tab-active-ink: #111111;
    }
  }
  * { box-sizing: border-box }
  html { -webkit-text-size-adjust: 100% }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif }
  .band { background: #111; color: #fff; border-bottom: 4px solid var(--yellow) }
  .band .in { max-width: 960px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-left)) 16px max(16px, env(safe-area-inset-right)); display: grid; gap: 4px }
  h1 { font-size: 22px; margin: 0; line-height: 1.2 } h1 a { color: #fff; text-decoration: none }
  h1 a::before { content: ""; display: inline-block; width: 12px; height: 12px; background: var(--yellow); margin-right: 10px; transform: rotate(45deg); vertical-align: 1px }
  .sub { color: #c9c9c3; font-size: 13px }
  main { max-width: 960px; margin: 0 auto; padding: 14px max(16px, env(safe-area-inset-left)) 56px max(16px, env(safe-area-inset-right)) }
  .search { display: grid; gap: 10px }
  .tabs { display: flex; gap: 4px; background: var(--tab-bg); padding: 4px; border-radius: 12px; width: fit-content; max-width: 100% }
  .tabs button { flex: 1 1 auto; font: 600 14px/1 inherit; padding: 9px 14px; border: 0; border-radius: 9px; background: transparent; color: var(--fg); cursor: pointer; white-space: nowrap }
  .tabs button[aria-selected="true"] { background: var(--tab-active); color: var(--tab-active-ink) }
  .tabs button:focus-visible { outline: 2px solid var(--yellow); outline-offset: 1px }
  .tabhint { font-size: 13px; color: var(--muted); margin: -4px 0 0 }
  .row { display: flex; gap: 8px }
  input[type=search] { flex: 1; min-width: 0; font-size: 17px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg) }
  input[type=search]:focus { outline: none; border-color: var(--yellow) }
  button.go { font: 600 16px inherit; padding: 12px 18px; border: 0; border-radius: 12px; background: var(--yellow); color: var(--yellow-ink); cursor: pointer }
  button.go:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px }
  .status { color: var(--muted); font-size: 14px; margin: 12px 0 }
  .hit { display: grid; grid-template-columns: 200px 1fr; gap: 14px; padding: 14px; margin: 10px 0; background: var(--surface); border-radius: 14px; border: 1px solid var(--line) }
  .hit > a { display: block } .hit img { width: 100%; max-width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: #000; display: block }
  .hit > div { min-width: 0 }
  .hit h2 { font-size: 17px; margin: 0 0 4px; line-height: 1.3 } .hit h2 a { color: inherit; text-decoration: none } .hit h2 a:hover { text-decoration: underline }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 6px }
  .m { margin: 6px 0; font-size: 15px; overflow-wrap: anywhere }
  .m a { color: var(--link); text-decoration: none; font-variant-numeric: tabular-nums; font-weight: 600; margin-right: 6px; white-space: nowrap }
  mark { background: var(--mark); color: var(--mark-ink); border-radius: 3px; padding: 0 2px }
  .more { font-size: 13px; color: var(--link); background: none; border: 0; padding: 4px 0; cursor: pointer; font-weight: 600 }
  @media (max-width: 600px) {
    .hit { grid-template-columns: 1fr; gap: 10px; padding: 12px }
    .tabs { width: 100% } .tabs button { padding: 9px 6px; font-size: 13px }
    button.go { padding: 12px 14px }
  }
  @media (prefers-reduced-motion: no-preference) { .hit { transition: border-color .15s } .hit:hover { border-color: var(--yellow) } }
</style>
</head>
<body>
<header class="band">
  <div class="in">
    <h1><a id="chname" href="#">Hledání v kanálu</a></h1>
    <div class="sub" id="chstats">Načítám…</div>
  </div>
</header>
<main>
  <form id="f" class="search">
    <div class="tabs" role="tablist" aria-label="Způsob hledání">
      <button type="button" role="tab" data-mode="hybrid" aria-selected="true">Chytré</button>
      <button type="button" role="tab" data-mode="fts" aria-selected="false">Přesná slova</button>
      <button type="button" role="tab" data-mode="vector" aria-selected="false">Podle významu</button>
    </div>
    <p class="tabhint" id="tabhint"></p>
    <div class="row">
      <input type="search" id="q" placeholder="Co hledáš? Fráze dej do uvozovek" autofocus autocomplete="off">
      <button type="submit" class="go">Hledat</button>
    </div>
  </form>
  <div class="status" id="status"></div>
  <div id="results"></div>
</main>
<script>
const API = location.origin;
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// highlighted obsahuje jen <mark> značky z backendu – escapujeme vše ostatní
const hl = s => esc(s).replace(/&lt;mark&gt;/g,'<mark>').replace(/&lt;\/mark&gt;/g,'</mark>');
const fmtDate = s => s ? new Date(s).toLocaleDateString('cs-CZ') : '';
const fmtDur = s => { if(!s) return ''; const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h?`${h} h ${m} min`:`${m} min`; };
const HINTS = {
  hybrid: 'Kombinuje přesná slova a význam. Nejlepší volba pro většinu dotazů.',
  fts: 'Najde jen úseky, kde zazněla zadaná slova (bez ohledu na diakritiku, "fráze v uvozovkách").',
  vector: 'Hledá podle významu, i když se slova liší – např. otázkou.'
};
let mode = 'hybrid';
function setMode(m, {store = true} = {}) {
  mode = m;
  document.querySelectorAll('.tabs [role=tab]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.mode === m)));
  $('#tabhint').textContent = HINTS[m];
  if (store) { try { localStorage.setItem('ytindex.mode', m); } catch {} }
}
document.querySelectorAll('.tabs [role=tab]').forEach(b => b.addEventListener('click', () => { setMode(b.dataset.mode); if ($('#q').value.trim()) doSearch($('#q').value); }));

async function loadChannel(){
  try{
    const r = await fetch(API+'/api/channel'); if(!r.ok) throw 0;
    const c = await r.json();
    $('#chname').textContent = c.name; $('#chname').href = c.url; document.title = c.name + ' – hledání';
    const s = c.stats, done = (s.videos_by_status||{}).done||0;
    $('#chstats').textContent = `${done} z ${s.videos} videí zaindexováno · ${s.total_hours} h přepisů`;
    if (!s.vector_search) { document.querySelectorAll('.tabs [role=tab]').forEach(b => { if (b.dataset.mode !== 'fts') b.disabled = true; }); setMode('fts', {store:false}); }
  }catch{ $('#chstats').textContent = 'Kanál zatím není inicializován (ytindex init / ingest).'; }
}

async function doSearch(q){
  if(!q.trim()) return;
  history.replaceState(null,'','?q='+encodeURIComponent(q)+'&mode='+mode);
  $('#status').textContent = 'Hledám…'; $('#results').innerHTML='';
  const t0 = performance.now();
  const r = await fetch(`${API}/api/search?q=${encodeURIComponent(q)}&limit=30&mode=${mode}`);
  if(!r.ok){ $('#status').textContent = 'Chyba: '+r.status; return; }
  const d = await r.json();
  const n = d.total;
  $('#status').textContent = n ? `${n} ${n===1?'video':n<5?'videa':'videí'} · ${(performance.now()-t0).toFixed(0)} ms` : 'Nic nenalezeno. Zkus kratší tvar slova nebo záložku „Podle významu“.';
  $('#results').innerHTML = d.results.map(h => `
    <article class="hit">
      <a href="${esc(h.match.url)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(h.thumbnail)}" alt=""></a>
      <div>
        <h2><a href="${esc(h.url)}" target="_blank" rel="noopener">${esc(h.title)}</a></h2>
        <div class="meta">${[fmtDate(h.published_at), fmtDur(h.duration_s), `${h.match_count} ${h.match_count===1?'shoda':h.match_count<5?'shody':'shod'}`].filter(Boolean).join(' · ')}</div>
        ${h.matches.map((m,i)=>`<div class="m" ${i?'hidden':''}><a href="${esc(m.url)}" target="_blank" rel="noopener">▶ ${m.timestamp}</a>${hl(m.highlighted)}</div>`).join('')}
        ${h.matches.length>1?`<button type="button" class="more">+ ${h.matches.length-1} další</button>`:''}
      </div>
    </article>`).join('');
  $('#results').querySelectorAll('.more').forEach(b => b.addEventListener('click', () => { b.parentNode.querySelectorAll('.m').forEach(e => e.hidden = false); b.remove(); }));
}

$('#f').addEventListener('submit', e => { e.preventDefault(); doSearch($('#q').value); });
const p = new URLSearchParams(location.search);
let saved = null; try { saved = localStorage.getItem('ytindex.mode'); } catch {}
setMode(HINTS[p.get('mode')] ? p.get('mode') : (HINTS[saved] ? saved : 'hybrid'), {store:false});
loadChannel();
if(p.get('q')){ $('#q').value = p.get('q'); doSearch(p.get('q')); }
</script>
</body>
</html>
