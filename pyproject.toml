[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytindex"
version = "0.1.0"
description = "Prohledavatelny index transkriptu vsech videi YouTube kanalu (ingest + hybridni vyhledavani + REST API)"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2025.1.1",
    "youtube-transcript-api>=1.2.0",
    "google-genai>=1.20.0",
    "sqlite-vec>=0.1.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ytindex = "ytindex.cli:main"

[tool.setuptools.packages.find]
include = ["ytindex*"]

[tool.setuptools.package-data]
ytindex = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
